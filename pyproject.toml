[project]
name = "gridpilot-impact-tank"
version = "0.1.0"
description = "GridPilot AI — synthetic single-building solar + battery dispatch optimizer (IMPACT TANK '26 prototype)."
authors = [{ name = "IMPACT TANK '26 Team" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "streamlit (>=1.39,<2.0)",
    "plotly (>=5.24,<7.0)",
    "pandas (>=2.2,<3.0)",
    "numpy (>=1.26,<3.0)",
    "scipy (>=1.12,<2.0)",
]

[tool.poetry]
packages = [{ include = "gridpilot" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
